[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[build]
  command = "bash generate-repo-export.sh"
  publish = "."
  functions = "functions"

[functions]
  node_bundler = "esbuild"

[functions."katago-move"]
  timeout = 26

[functions."game-summary"]
  timeout = 26

[functions."game-katago"]
  timeout = 26

[functions."game-comment"]
  timeout = 26

[functions."analyze-move"]
  timeout = 26

[functions."game-hint"]
  timeout = 26

[functions."evaluate-move"]
  timeout = 26

[functions."joseki-deviation"]
  timeout = 26

[functions."atari-move"]
  timeout = 26
